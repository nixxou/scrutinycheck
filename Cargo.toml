[package]
name = "scrutinycheck"
version = "0.1.1"
edition = "2024"
description = "Disk health verdict from smartctl JSON, using Scrutiny's rules, as a single CLI"
license = "MIT"
repository = "https://github.com/nixxou/scrutinycheck"
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
